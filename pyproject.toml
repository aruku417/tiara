[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tiara"
dynamic = ["version"]
description = "Get your PR branch conflict-free before GitHub sees it - deterministic merges first, a small handoff for your coding agent (Claude Code, Codex) for the rest."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []
keywords = ["git", "merge", "conflict", "pull-request", "ai-agents", "claude-code", "codex"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6"]

[project.scripts]
tiara = "tiara.cli:main"

[tool.setuptools.dynamic]
version = {attr = "tiara.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
