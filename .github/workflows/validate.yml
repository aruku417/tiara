name: Validate tiara

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Public repository: GitHub-hosted runner only (no billed minutes for public repositories).
    # Never a self-hosted runner: a pull request from anyone could run code on it.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --no-deps -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests
